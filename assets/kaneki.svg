      .q { font-size: 20px; font-weight: 600; fill: #8c8c8c; letter-spacing: 1px; }
      .n { font-size: 20px; font-weight: 800; fill: #ff1f3d; opacity: 0; animation: tick 7s linear infinite; }
      @keyframes tick { 0%, 13% { opacity: 1 } 14.28%, 100% { opacity: 0 } }
      .sway { transform-box: view-box; animation: sway 6s ease-in-out infinite alternate; }
      .s2 { animation-duration: 7.5s; animation-delay: -2s } .s3 { animation-duration: 5.2s; animation-delay: -1s } .s4 { animation-duration: 8s; animation-delay: -3s }
      @keyframes sway { from { transform: rotate(-3deg) } to { transform: rotate(4deg) } }
      .lid { animation: blink 6s ease-in-out infinite; transform-origin: 0 0; }
      @keyframes blink { 0%, 92%, 100% { transform: scaleY(0) } 95% { transform: scaleY(1) } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .55 } }
      .drip { animation: drip 4s ease-in infinite; }
      @keyframes drip { 0% { transform: translateY(-30px); opacity: 0 } 15% { opacity: 1 } 100% { transform: translateY(360px); opacity: 0 } }
      .cur { animation: blink2 1s steps(1) infinite; } @keyframes blink2 { 50% { opacity: 0 } }
    </style>
