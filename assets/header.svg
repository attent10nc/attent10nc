<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0d10"/>
      <stop offset=".55" stop-color="#2a0f22"/>
      <stop offset="1" stop-color="#1b1033"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".18" cy=".1" r=".55">
      <stop offset="0" stop-color="#ff4d5e" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".9" cy=".95" r=".6">
      <stop offset="0" stop-color="#8b3dff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8b3dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a4e"/>
      <stop offset=".5" stop-color="#ff2f7a"/>
      <stop offset="1" stop-color="#a14dff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5a4e"/>
      <stop offset="1" stop-color="#b44dff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="22"/></clipPath>
    <style>
      .t { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .name { font-size: 76px; font-weight: 800; letter-spacing: -2px; }
      .sub { font-size: 26px; font-weight: 600; fill: #e9dfe6; }
      .meta { font-size: 18px; fill: #b9a9b6; }
      .fade { opacity: 0; animation: in .9s ease-out forwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s }
      @keyframes in { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
      .b { transform-box: fill-box; transform-origin: 50% 100%; animation: eq 1.4s ease-in-out infinite alternate; }
      @keyframes eq { 0% { transform: scaleY(.25) } 100% { transform: scaleY(1) } }
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .orb { animation: drift 9s ease-in-out infinite alternate; }
      @keyframes drift { to { transform: translate(-40px, 20px) } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect class="orb" width="1200" height="320" fill="url(#glowA)"/>
    <rect width="1200" height="320" fill="url(#glowB)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- эквалайзер справа -->
    <g transform="translate(820 70)" opacity=".9">
      <rect class="b" x="0"   y="20"  width="14" height="160" rx="7" fill="url(#bar)" style="animation-delay:-.2s"/>
      <rect class="b" x="30"  y="0"   width="14" height="180" rx="7" fill="url(#bar)" style="animation-delay:-.9s"/>
      <rect class="b" x="60"  y="50"  width="14" height="130" rx="7" fill="url(#bar)" style="animation-delay:-.5s"/>
      <rect class="b" x="90"  y="10"  width="14" height="170" rx="7" fill="url(#bar)" style="animation-delay:-1.2s"/>
      <rect class="b" x="120" y="70"  width="14" height="110" rx="7" fill="url(#bar)" style="animation-delay:-.3s"/>
      <rect class="b" x="150" y="30"  width="14" height="150" rx="7" fill="url(#bar)" style="animation-delay:-.7s"/>
      <rect class="b" x="180" y="0"   width="14" height="180" rx="7" fill="url(#bar)" style="animation-delay:-1.1s"/>
      <rect class="b" x="210" y="60"  width="14" height="120" rx="7" fill="url(#bar)" style="animation-delay:-.4s"/>
      <rect class="b" x="240" y="20"  width="14" height="160" rx="7" fill="url(#bar)" style="animation-delay:-.8s"/>
      <rect class="b" x="270" y="80"  width="14" height="100" rx="7" fill="url(#bar)" style="animation-delay:-.1s"/>
    </g>

    <g class="t">
      <text class="name fade d1" x="70" y="150" fill="#ffffff">attent<tspan fill="url(#accent)">10</tspan>nc<tspan class="cur" fill="#ff2f7a">_</tspan></text>
      <text class="sub fade d2" x="72" y="200">Боты, моды и игры, которыми реально пользуются</text>
      <text class="meta fade d3" x="72" y="250">Python · C# · TypeScript · Luau  —  Telegram · Electron · Roblox · Dota 2</text>
    </g>
  </g>
</svg>
