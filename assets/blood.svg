<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <radialGradient id="glow" cx=".8" cy=".5" r=".6">
      <stop offset="0" stop-color="#8a0010" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8a0010" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".05" cy="0" r=".5">
      <stop offset="0" stop-color="#5a0008" stop-opacity=".5"/>
      <stop offset="1" stop-color="#5a0008" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a0008"/>
      <stop offset=".6" stop-color="#a8001a"/>
      <stop offset="1" stop-color="#d10a1e"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="340" rx="18"/></clipPath>
    <style>
      .t { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .name { font-size: 84px; font-weight: 900; letter-spacing: -3px; fill: #f5f5f5; }
      .sub { font-size: 22px; font-weight: 600; fill: #d9d9d9; letter-spacing: 6px; }
      .q { font-size: 20px; font-weight: 600; fill: #8c8c8c; letter-spacing: 1px; }
      .n { font-size: 20px; font-weight: 800; fill: #ff1f3d; opacity: 0; animation: tick 7s linear infinite; }
      @keyframes tick { 0%, 13% { opacity: 1 } 14.28%, 100% { opacity: 0 } }
      .hang { transform-box: fill-box; transform-origin: 50% 0; animation: hang 5s ease-in-out infinite alternate; }
      @keyframes hang { from { transform: scaleY(.85) } to { transform: scaleY(1.15) } }
      .drop { animation: drop 3.6s cubic-bezier(.55,0,1,.45) infinite; opacity: 0; }
      @keyframes drop { 0% { transform: translateY(0); opacity: 0 } 8% { opacity: 1 } 85% { opacity: 1 } 100% { transform: translateY(300px); opacity: 0 } }
      .splat { transform-box: fill-box; transform-origin: 50% 50%; animation: splat 3.6s ease-out infinite; opacity: 0; }
      @keyframes splat { 0%, 82% { transform: scale(0); opacity: 0 } 86% { opacity: .9 } 100% { transform: scale(1); opacity: 0 } }
      .cur { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="#070707"/>
    <rect width="1200" height="340" fill="url(#glow2)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>

    <!-- кровь стекает с верхнего края -->
    <path fill="url(#blood)" d="M0 0 H1200 V18 C1170 20 1160 14 1140 22 C1120 30 1100 16 1070 20 C1040 24 1020 12 990 20 C960 28 930 14 900 18 C870 22 850 30 820 20 C790 12 770 26 740 22 C710 18 690 10 660 20 C630 30 610 14 580 18 C550 22 520 28 490 20 C460 12 440 24 410 22 C380 20 360 10 330 18 C300 26 280 16 250 20 C220 24 200 30 170 20 C140 12 120 22 90 20 C60 18 40 26 0 20Z"/>
    <g fill="url(#blood)">
      <path class="hang" d="M126 18 C126 40 120 60 126 78 C132 60 126 40 126 18Z" style="animation-delay:-1s"/>
      <path class="hang" d="M540 18 C538 50 532 96 542 110 C552 96 544 50 540 18Z" style="animation-delay:-2.2s"/>
      <path class="hang" d="M455 20 C455 40 450 54 456 64 C462 54 456 40 455 20Z" style="animation-delay:-.4s"/>
      <path class="hang" d="M612 18 C610 52 604 120 614 140 C624 120 616 52 612 18Z" style="animation-delay:-3.1s"/>
      <path class="hang" d="M760 22 C760 40 755 52 761 60 C767 52 761 40 760 22Z" style="animation-delay:-1.7s"/>
      <path class="hang" d="M905 18 C903 46 897 84 907 98 C917 84 909 46 905 18Z" style="animation-delay:-2.8s"/>
      <path class="hang" d="M1040 20 C1039 50 1032 140 1043 170 C1054 140 1045 50 1040 20Z" style="animation-delay:-.9s"/>
      <path class="hang" d="M1150 20 C1150 36 1145 48 1151 56 C1157 48 1151 36 1150 20Z" style="animation-delay:-3.6s"/>
    </g>

    <!-- падающие капли и брызги внизу -->
    <g fill="#d10a1e">
      <path class="drop" d="M542 104 q6 14 0 22 q-6 -8 0 -22Z" style="animation-delay:-.5s"/>
      <path class="drop" d="M614 134 q6 14 0 22 q-6 -8 0 -22Z" style="animation-delay:-2s"/>
      <path class="drop" d="M1043 164 q5 12 0 19 q-5 -7 0 -19Z" style="animation-delay:-1.2s; animation-duration:3s"/>
      <path class="drop" d="M907 92 q5 12 0 19 q-5 -7 0 -19Z" style="animation-delay:-2.7s"/>
      <ellipse class="splat" cx="1043" cy="334" rx="26" ry="5" style="animation-delay:-1.2s; animation-duration:3s"/>
      <ellipse class="splat" cx="907" cy="334" rx="22" ry="4" style="animation-delay:-2.7s"/>
    </g>

    <!-- лужа справа снизу -->
    <path fill="#a8001a" opacity=".75" d="M860 340 C880 326 940 322 990 328 C1030 318 1090 320 1130 330 C1160 326 1190 330 1200 334 V340Z"/>

    <g class="t">
      <text class="name" x="70" y="170">attent<tspan fill="#d10a1e">10</tspan>nc<tspan class="cur" fill="#d10a1e">_</tspan></text>
      <rect x="72" y="194" width="120" height="4" fill="#d10a1e"/>
      <text class="sub" x="72" y="236">БОТЫ · МОДЫ · ИГРЫ</text>
      <text class="q" x="72" y="290">1000 − 7 =</text>
      <g transform="translate(190 290)">
        <text class="n" style="animation-delay:0s">993</text>
        <text class="n" style="animation-delay:1s">986</text>
        <text class="n" style="animation-delay:2s">979</text>
        <text class="n" style="animation-delay:3s">972</text>
        <text class="n" style="animation-delay:4s">965</text>
        <text class="n" style="animation-delay:5s">958</text>
        <text class="n" style="animation-delay:6s">951</text>
      </g>
    </g>
  </g>
</svg>
